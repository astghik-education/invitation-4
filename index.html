<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Նկարների պատկերասրահ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .gallery-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .slider {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 10px;
            background: #f0f0f0;
        }

        .slides {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: auto;
            display: block;
            max-height: 500px;
            object-fit: contain;
            background: #f0f0f0;
        }

        .slide-label {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
            z-index: 10;
        }

        .nav-btn:hover {
            background: white;
            transform: translateY(-50%) scale(1.1);
        }

        .prev-btn {
            left: 15px;
        }

        .next-btn {
            right: 15px;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background: #667eea;
            transform: scale(1.3);
        }

        .counter {
            text-align: center;
            margin-top: 15px;
            color: #555;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <h1>🖼️ Նկարների պատկերասրահ</h1>
        
        <div class="slider">
            <div class="slides" id="slides">
                <div class="slide">
                    <img src="img-01.jpg" alt="Նկար 1" onerror="this.src='https://via.placeholder.com/800x500/667eea/ffffff?text=img-01'">
                    <div class="slide-label">img-01</div>
                </div>
                <div class="slide">
                    <img src="img-02.jpg" alt="Նկար 2" onerror="this.src='https://via.placeholder.com/800x500/764ba2/ffffff?text=img-02'">
                    <div class="slide-label">img-02</div>
                </div>
                <div class="slide">
                    <img src="img-03.jpg" alt="Նկար 3" onerror="this.src='https://via.placeholder.com/800x500/f093fb/ffffff?text=img-03'">
                    <div class="slide-label">img-03</div>
                </div>
                <div class="slide">
                    <img src="img-04.jpg" alt="Նկար 4" onerror="this.src='https://via.placeholder.com/800x500/4facfe/ffffff?text=img-04'">
                    <div class="slide-label">img-04</div>
                </div>
            </div>
            
            <button class="nav-btn prev-btn" onclick="changeSlide(-1)">❮</button>
            <button class="nav-btn next-btn" onclick="changeSlide(1)">❯</button>
        </div>

        <div class="dots" id="dots">
            <span class="dot active" onclick="goToSlide(0)"></span>
            <span class="dot" onclick="goToSlide(1)"></span>
            <span class="dot" onclick="goToSlide(2)"></span>
            <span class="dot" onclick="goToSlide(3)"></span>
        </div>

        <div class="counter" id="counter">1 / 4</div>
    </div>

    <script>
        let currentSlide = 0;
        const totalSlides = 4;
        const slides = document.getElementById('slides');
        const dots = document.querySelectorAll('.dot');
        const counter = document.getElementById('counter');

        function updateSlider() {
            slides.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
            
            counter.textContent = `${currentSlide + 1} / ${totalSlides}`;
        }

        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide < 0) {
                currentSlide = totalSlides - 1;
            } else if (currentSlide >= totalSlides) {
                currentSlide = 0;
            }
            updateSlider();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlider();
        }

        // Ավտոմատ փոխանցում 5 վայրկյանը մեկ
        setInterval(() => {
            changeSlide(1);
        }, 5000);

        // Ստեղնաշարի կառավարում
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
        });
    </script>
</body>
</html>
